[package]
name = "avb-probe"
description = "Phase 0 CLI probe for the AVBBcmDriver dext: EAV clock, RX/TX PTP timestamp tests (G2/G3/G4)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "avb_probe"
path = "src/lib.rs"

[[bin]]
name = "avb-probe"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
core-foundation-sys = "=0.8.7"
io-kit-sys = "=0.5.0"
mach2 = "=0.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
