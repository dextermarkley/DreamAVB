[workspace]
members = ["crates/avb-core", "crates/avb-config", "crates/avb-dext", "crates/avb-gptp", "crates/avb-installer", "crates/avb-probe", "crates/avb-srp", "crates/avb-avtp", "crates/avb-avdecc", "crates/avb-mediaclock", "crates/avb-audioring", "crates/avb-daemon", "crates/avb-coreaudio"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
debug = 1
