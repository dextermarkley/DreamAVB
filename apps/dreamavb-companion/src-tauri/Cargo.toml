# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "dreamavb-companion"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "DreamAVB desktop companion: pick a NIC, hand it to the DreamAVB driver, watch live stats — or leave it to the default driver."
publish = false

# Standalone app, intentionally NOT a workspace member (Tauri has its own build
# flow and should not join the stack's `cargo test` gate).
[workspace]

[lib]
name = "dreamavb_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }

[dependencies]
tauri = { version = "=2.5.1", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "=2.2.0"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
# The recovered-audio ring crate (reused from the stack) to read live media-
# clock + counter stats straight from the shared ring, no daemon IPC needed.
avb-audioring = { path = "../../../crates/avb-audioring" }
# Shared user settings (clock source selection + effective-clock resolution),
# read by the daemon too. Same path-dep style as avb-audioring above.
avb-config = { path = "../../../crates/avb-config" }

# Cap the runtime/windowing crates to the tauri 2.5 wave. Cargo otherwise floats
# every transitive ^2 dep to its newest minor (tauri-runtime 2.12, wry 0.57),
# which no longer matches the tauri 2.5.1 app crate's trait definitions. Pinning
# them as direct deps keeps the whole closure on one coherent wave.
tauri-runtime = "=2.6.0"
tauri-runtime-wry = "=2.6.0"


[features]
custom-protocol = ["tauri/custom-protocol"]
