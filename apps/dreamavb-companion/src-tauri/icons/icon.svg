<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.55" stop-color="#5c6cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#2a3bff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <g filter="url(#glow)">
    <rect x="140" y="140" width="744" height="744" rx="180" fill="url(#bg)"/>
    <rect x="140" y="140" width="744" height="744" rx="180" fill="url(#sheen)"/>
  </g>

  <!-- audio waveform: a clean AVB-style pulse -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 512
             L352 512
             L410 352
             L500 672
             L560 420
             L600 560
             L660 512
             L774 512"/>
  </g>
  <!-- small node dots at the peaks for a 'network' feel -->
  <circle cx="500" cy="672" r="20" fill="#ffffff"/>
  <circle cx="410" cy="352" r="20" fill="#ffffff"/>
</svg>
